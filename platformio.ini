; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Plain `pio run` builds only the normal firmware; use `-e <name>` for the others.
[platformio]
default_envs = esp32-s3-devkitc1-n16r8

; Shared settings for every environment below.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_HZ=1000
    -O2
    -I "${PROJECT_INCLUDE_DIR}"
; main_touchcal.cpp provides its own setup()/loop() for the touch_cal build
; only; every other env uses main.cpp, so exclude it from the default source set.
build_src_filter =
    +<*>
    -<main_touchcal.cpp>
lib_deps =
    lvgl/lvgl @ ^9.4.0

; Normal firmware: locks a table per group and polls live data.
[env:esp32-s3-devkitc1-n16r8]

; Diagnostic build: after init, sweep every table id 0x00..0xFF once, print which
; ones return data, then idle.  Build/upload with `-e kline_scan`.
[env:kline_scan]
build_flags =
    ${env.build_flags}
    -DKLINE_SCAN=1

; Screen/touch bring-up build: display + LVGL + forced touch calibration + a
; live accuracy test screen.  No K-line — only main_touchcal.cpp +
; touch.cpp + display.cpp are compiled.  Build/upload with `-e touch_cal`.
[env:touch_cal]
build_src_filter =
    +<main_touchcal.cpp>
    +<touch.cpp>
    +<display.cpp>
    +<wdt.cpp>